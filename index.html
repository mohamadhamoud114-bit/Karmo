<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجري الإلكتروني</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="logo">
            <h2><i class="fas fa-shopping-bag"></i> متجري</h2>
        </div>
        <div class="cart-icon" onclick="toggleCart()">
            <i class="fas fa-shopping-cart"></i>
            <span id="cart-count">0</span>
        </div>
    </header>

    <section class="hero">
        <h1>أهلاً بك في متجرنا الرقمي</h1>
        <p>أفضل المنتجات بأسعار منافسة وجودة عالية</p>
    </section>

    <main class="products-container" id="products-list"></main>

    <div class="cart-modal" id="cart-modal">
        <div class="cart-content">
            <span class="close-btn" onclick="toggleCart()">&times;</span>
            <h2><i class="fas fa-cart-arrow-down"></i> سلة التسوق</h2>
            <div id="cart-items"></div>
            <div class="cart-total">
                <h3>المجموع الكلي: <span id="cart-total-price">0</span> $</h3>
            </div>
            <button class="checkout-btn" onclick="checkout()">إتمام الشراء</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
